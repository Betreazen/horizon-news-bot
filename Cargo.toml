[package]
name = "horizon-news-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Posts confirmed Horizon release news to Telegram in Russian"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# The bot runs for a second or two and spends that time waiting on the
# network, so the release build is tuned for a small download, not speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
