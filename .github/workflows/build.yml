name: build

# Tests the bot and publishes its binary as the `bot` release, so the
# scheduled news run downloads a ready program instead of compiling one.
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Builds queue up instead of cancelling each other, so an upload is never
# cut off halfway.
concurrency:
  group: build
  cancel-in-progress: false

env:
  TARGET: x86_64-unknown-linux-musl
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Used by the last step only, to upload the binary.
      contents: write
      # Used by the attest step only, to sign a statement that this run
      # built this binary from this commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Build scripts of dependencies run below; they get no token.
          persist-credentials: false

      - name: Install the static Linux target
        run: |
          rustup target add "$TARGET"
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET"
          ls -la "target/$TARGET/release/horizon-news-bot"

      # The news run refuses a binary that lacks this signed statement, so
      # a file swapped into the release by hand is never executed.
      - name: Attest the binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/${{ env.TARGET }}/release/horizon-news-bot

      - name: Publish the binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view bot > /dev/null 2>&1; then
            gh release create bot --target "$GITHUB_SHA" --latest=false \
              --title "Bot binary" \
              --notes "The current build of the bot. The scheduled news run downloads it from here."
          fi
          gh release upload bot "target/$TARGET/release/horizon-news-bot" --clobber
