name: bench-models

# One-off measurement: which open model translates Horizon changelog lines
# well enough and fast enough on a GitHub runner.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/bench.yml", "bench/**", "src/prompt.txt"]

permissions:
  contents: read

env:
  LLAMA_BUILD: b12110

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e4b-flag
            repo: unsloth/gemma-4-E4B-it-GGUF
            file: gemma-4-E4B-it-Q4_K_M.gguf
            server_args: "--reasoning-budget 0"
            request_extra: "{}"
          - name: e4b-kwargs
            repo: unsloth/gemma-4-E4B-it-GGUF
            file: gemma-4-E4B-it-Q4_K_M.gguf
            server_args: ""
            request_extra: '{"chat_template_kwargs": {"enable_thinking": false}}'
          - name: e2b-flag
            repo: unsloth/gemma-4-E2B-it-GGUF
            file: gemma-4-E2B-it-Q4_K_M.gguf
            server_args: "--reasoning-budget 0"
            request_extra: "{}"
          - name: e2b-kwargs
            repo: unsloth/gemma-4-E2B-it-GGUF
            file: gemma-4-E2B-it-Q4_K_M.gguf
            server_args: ""
            request_extra: '{"chat_template_kwargs": {"enable_thinking": false}}'
    steps:
      - uses: actions/checkout@v4

      - name: Download llama.cpp and the model
        run: |
          set -euo pipefail
          t0=$(date +%s)
          curl -sSfL -o llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          mkdir llama && tar -xzf llama.tar.gz -C llama
          find llama -name 'llama-server' -type f
          du -sh llama
          curl -sSfL -o model.gguf \
            "https://huggingface.co/${{ matrix.repo }}/resolve/main/${{ matrix.file }}"
          ls -la model.gguf
          echo "download took $(( $(date +%s) - t0 )) s"

      - name: Start llama-server
        run: |
          set -euo pipefail
          bin=$(find llama -name 'llama-server' -type f | head -1)
          export LD_LIBRARY_PATH="$(dirname "$bin")"
          t0=$(date +%s)
          nohup "$bin" -m model.gguf -c 4096 -t "$(nproc)" --host 127.0.0.1 --port 8089 \
            ${{ matrix.server_args }} > server.log 2>&1 &
          for i in $(seq 1 180); do
            if curl -sf http://127.0.0.1:8089/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8089/health || { tail -n 40 server.log; exit 1; }
          echo; echo "server ready after $(( $(date +%s) - t0 )) s"

      - name: Translate the sample lines
        env:
          REQUEST_EXTRA: ${{ matrix.request_extra }}
        run: |
          set -euo pipefail
          system=$(cat src/prompt.txt)
          t0=$(date +%s)
          n=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            n=$((n + 1))
            body=$(jq -n --arg s "$system" --arg u "$line" --argjson extra "$REQUEST_EXTRA" \
              '{temperature: 0, max_tokens: 256,
                messages: [{role: "system", content: $s}, {role: "user", content: $u}]} + $extra')
            out=$(curl -sS -m 300 http://127.0.0.1:8089/v1/chat/completions \
              -H 'Content-Type: application/json' -d "$body")
            text=$(jq -r '.choices[0].message.content // .error.message // "?"' <<< "$out")
            meta=$(jq -c '{finish: .choices[0].finish_reason,
                           thought: ((.choices[0].message.reasoning_content // "") | length),
                           prompt_n: .timings.prompt_n, cache_n: .timings.cache_n,
                           prompt_ms: (.timings.prompt_ms // 0 | floor),
                           out_n: .timings.predicted_n,
                           out_ms: (.timings.predicted_ms // 0 | floor)}' <<< "$out")
            printf 'EN: %s\nRU: %s\n    %s\n' "$line" "$text" "$meta"
          done < bench/lines.txt
          total=$(( $(date +%s) - t0 ))
          echo "=== ${{ matrix.name }}: $n lines in $total s"

      - name: Server log tail
        if: always()
        run: tail -n 25 server.log || true
